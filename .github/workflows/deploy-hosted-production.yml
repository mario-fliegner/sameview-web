name: Deploy Hosted to Production

# Manual dispatch only for now. Hosted is a separate, independently
# deployable application from the root (web.sameview.app) — see
# docs/HOSTED_COMPARISON_IMPLEMENTATION_PLAN_V1.md Phase 2. A tag-based
# trigger is deliberately not introduced yet: no tag-naming convention for
# Hosted releases has been decided, and inventing one here would assert an
# unverified operational process. workflow_dispatch keeps this fully
# reversible — nothing runs unless explicitly triggered.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Never run two deploys to the same FTP target at once. Do not cancel an
  # in-flight upload — that could leave the server in an inconsistent state.
  group: hosted-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Install, verify and build (hosted)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26 # matches the Netcup runtime (26.5.0); do not lower to 22
          cache: pnpm
          cache-dependency-path: hosted/pnpm-lock.yaml

      - name: Install hosted dependencies (frozen lockfile)
        run: pnpm --dir hosted install --frozen-lockfile

      - name: Hosted test
        run: pnpm --dir hosted test

      - name: Hosted typecheck
        run: pnpm --dir hosted typecheck

      - name: Hosted build
        run: pnpm --dir hosted build

      - name: Assemble hosted deployment artifact
        run: |
          set -euo pipefail
          rm -rf hosted-release
          mkdir -p hosted-release
          cp -r hosted/dist hosted-release/dist
          cp hosted/package.json hosted-release/package.json
          cp hosted/app.js hosted-release/app.js

      - name: Generate npm runtime lockfile for the hosted artifact
        # Netcup/Plesk's Node.js panel only offers npm or yarn as the package
        # manager — pnpm is not selectable there (same constraint as the root
        # application — see docs/deployment.md). hosted/pnpm-lock.yaml stays
        # the authoritative lockfile for development, CI install, typecheck,
        # test and build above; it is not uploaded and hosted/ does not
        # switch to npm. Only this isolated hosted-release/ copy of
        # package.json is used to generate a matching, production-only npm
        # lockfile, so the server can run a reproducible `npm ci --omit=dev`.
        working-directory: hosted-release
        run: npm install --package-lock-only --omit=dev --ignore-scripts

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: hosted-production-release
          path: hosted-release/
          retention-days: 14

  deploy:
    name: Deploy Hosted to Netcup (FTPS)
    needs: build
    runs-on: ubuntu-latest
    environment: hosted-production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: hosted-production-release
          path: hosted-release

      - name: Deploy via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.NETCUP_HOSTED_FTP_HOST }}
          port: ${{ vars.NETCUP_HOSTED_FTP_PORT }}
          protocol: ${{ vars.NETCUP_HOSTED_FTP_PROTOCOL }}
          username: ${{ secrets.NETCUP_HOSTED_FTP_USERNAME }}
          password: ${{ secrets.NETCUP_HOSTED_FTP_PASSWORD }}
          local-dir: ./hosted-release/
          server-dir: ${{ vars.NETCUP_HOSTED_DEPLOY_PATH }}
          # Never wipe the target first — .env, node_modules, uploads and
          # other persistent/manually-managed files must survive every
          # deploy, mirroring the root application's own deploy-production.yml.
          dangerous-clean-slate: false
          # Defense in depth: local-dir never contains these paths anyway,
          # but keep them explicitly excluded from the sync.
          exclude: |
            **/.env
            **/.env.*
            **/node_modules/**
            **/.git*

      - name: Next steps (manual)
        run: |
          echo "Hosted deployment uploaded successfully to Netcup."
          echo "Target path: ${{ vars.NETCUP_HOSTED_DEPLOY_PATH }}"
          echo ""
          echo "Manual steps required now:"
          echo "1. In the Netcup/Plesk dashboard, install runtime dependencies for the Hosted Node.js application (npm ci --omit=dev if free-form commands are available, otherwise Plesk's own install action)."
          echo "2. Click 'Restart App' for the Hosted Node.js application in the Netcup/Plesk dashboard."
          echo "3. Manually verify: ${{ vars.HOSTED_PRODUCTION_URL }}"
