; docs/EMBED_IN_WEBSITE.md "Localization": English is the fallback language.
; MOD_SAMEVIEW_COMPARISON and MOD_SAMEVIEW_COMPARISON_XML_DESCRIPTION are
; duplicated here from mod_sameview_comparison.sys.ini: confirmed against
; real Joomla 6.1.2 core source that the module edit screen
; (administrator/components/com_modules/src/Model/ModuleModel.php
; preprocessForm(), via Language::load($module, $client->path)) only ever
; loads this regular .ini, never .sys.ini, so a name/description defined
; only in .sys.ini renders as a raw, untranslated key on that one screen
; even though the same strings resolve correctly elsewhere (the Extensions
; Manage list, the New Module selection card), which load language via a
; separate, sys.ini-based extension-discovery mechanism.
MOD_SAMEVIEW_COMPARISON="SameView Comparison"
MOD_SAMEVIEW_COMPARISON_XML_DESCRIPTION="Displays one existing SameView Comparison in this module position. Select the Comparison by title; no preview is shown here."
MOD_SAMEVIEW_COMPARISON_FIELD_SESSION_LABEL="Comparison"
MOD_SAMEVIEW_COMPARISON_FIELD_SESSION_DESC="The SameView Comparison to display in this module position."
MOD_SAMEVIEW_COMPARISON_FIELD_SESSION_HEADER="- Select a Comparison -"
MOD_SAMEVIEW_COMPARISON_FIELD_SESSION_MISSING="Missing Comparison (%s)"
